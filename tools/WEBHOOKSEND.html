<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhooks Pro | Final Edition</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --panel-dark: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-yellow: #d29922;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }

        .container {
            background: var(--panel-dark); padding: 25px; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 600px; border: 1px solid var(--border-color);
        }

        h2 { text-align: center; color: var(--accent-blue); margin-top: 0; }
        label { font-size: 0.85em; color: #8b949e; display: block; margin-top: 12px; }

        .input-wrapper { position: relative; }

        input, textarea, select {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px;
            border: 1px solid var(--border-color); background: var(--bg-dark); color: white; box-sizing: border-box; outline: none;
        }

        .status-dot {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            width: 10px; height: 10px; border-radius: 50%; background: #444; transition: 0.3s;
        }

        .avatar-preview {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--border-color);
            background-size: cover; background-position: center; flex-shrink: 0;
            background-image: url('https://discord.com/assets/2c21aeda16de354ba5334551a883b481.png');
        }

        .row { display: flex; gap: 12px; align-items: flex-end; }
        
        .btn-send {
            background: var(--accent-green); color: white; border: none; padding: 15px; width: 100%; 
            font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; font-size: 1.1em;
        }

        .monitor-header {
            width: 100%; max-width: 600px; display: flex; justify-content: space-between; 
            align-items: center; margin-top: 25px; margin-bottom: 10px;
        }

        .btn-clear-all {
            background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red);
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8em;
        }

        .btn-clear-all:hover { background: var(--accent-red); color: white; }

        .log-entry {
            background: var(--panel-dark); padding: 12px; border-radius: 8px; margin-bottom: 10px;
            border: 1px solid var(--border-color); border-right: 5px solid var(--accent-blue);
            display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-mini { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 0.8em; }
        .stop-btn { background: var(--accent-yellow); }
        .del-btn { background: #484f58; }
        .hidden { display: none; }
    </style>
</head>
<body onload="loadLastWebhook()">

<div class="container">
    <h2>🎭 مرسل الويب هوك الاحترافي</h2>
    
    <label>رابط الويب هوك (عادي / كناري)</label>
    <div class="input-wrapper">
        <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." oninput="checkWebhook(this.value)">
        <div id="statusDot" class="status-dot"></div>
    </div>
    <span id="statusMessage" style="font-size: 0.75em; margin-top:5px; display:block; color: #8b949e;">يرجى إدخال الرابط...</span>

    <div class="row" style="margin-top: 10px;">
        <div style="flex: 1;">
            <label>اسم البوت</label>
            <input type="text" id="botName" placeholder="Bot Name">
        </div>
        <div style="flex: 1.2;">
            <label>رابط الصورة</label>
            <input type="text" id="botAvatar" placeholder="URL" oninput="updateAvatarPreview(this.value)">
        </div>
        <div id="avatarPreview" class="avatar-preview"></div>
    </div>

    <div class="row">
        <div style="flex: 1.5;">
            <label>نوع المنشن</label>
            <select id="mentionType" onchange="toggleRoleInput()">
                <option value="none">بدون</option>
                <option value="everyone">@everyone</option>
                <option value="here">@here</option>
                <option value="role">رتبة (ID)</option>
            </select>
        </div>
        <div id="idInputContainer" style="flex: 1;" class="hidden">
            <label>الـ ID</label>
            <input type="text" id="targetId" placeholder="123456...">
        </div>
    </div>

    <div class="row">
        <div style="flex: 1;">
            <label>عدد الرسائل</label>
            <input type="number" id="count" value="10">
        </div>
        <div style="flex: 1;">
            <label>التأخير (ثانية)</label>
            <input type="number" id="delay" value="0.8" step="0.1">
        </div>
    </div>

    <label>الرسالة</label>
    <textarea id="message" rows="2" placeholder="اكتب رسالتك..."></textarea>

    <button id="mainSendBtn" class="btn-send" onclick="createNewTask()" disabled style="opacity: 0.5; cursor: not-allowed;">بدء الإرسال 🚀</button>
</div>

<div class="monitor-header">
    <span>العمليات الجارية:</span>
    <button class="btn-clear-all" onclick="clearFinished()">مسح الكل المنتهي 🗑️</button>
</div>

<div id="taskLogs" style="width: 100%; max-width: 600px;"></div>

<script>
    let checkTimer;

    function loadLastWebhook() {
        const savedUrl = localStorage.getItem('lastWebhook');
        if (savedUrl) { document.getElementById('webhookUrl').value = savedUrl; checkWebhook(savedUrl); }
    }

    function toggleRoleInput() {
        const type = document.getElementById('mentionType').value;
        document.getElementById('idInputContainer').classList.toggle('hidden', type !== 'role');
    }

    function updateAvatarPreview(url) {
        const preview = document.getElementById('avatarPreview');
        preview.style.backgroundImage = url.trim() === "" ? "none" : `url('${url}')`;
    }

    async function checkWebhook(url) {
        clearTimeout(checkTimer);
        const dot = document.getElementById('statusDot');
        const msg = document.getElementById('statusMessage');
        const btn = document.getElementById('mainSendBtn');

        const isValid = url.startsWith("https://discord.com/api/webhooks/") || url.startsWith("https://canary.discord.com/api/webhooks/");

        if (!isValid) {
            dot.style.background = "#444"; msg.innerText = "الرابط غير صالح!"; msg.style.color = "var(--accent-red)";
            btn.disabled = true; btn.style.opacity = "0.5"; return;
        }

        msg.innerText = "جاري الفحص..."; msg.style.color = "var(--accent-yellow)";

        checkTimer = setTimeout(async () => {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    dot.style.background = "var(--accent-green)";
                    msg.innerText = `✅ شغال: ${data.name}`; msg.style.color = "var(--accent-green)";
                    btn.disabled = false; btn.style.opacity = "1"; btn.style.cursor = "pointer";
                    localStorage.setItem('lastWebhook', url);
                } else { throw new Error(); }
            } catch (e) {
                dot.style.background = "var(--accent-red)"; msg.innerText = "❌ الرابط معطل!"; msg.style.color = "var(--accent-red)";
                btn.disabled = true; btn.style.opacity = "0.5";
            }
        }, 600);
    }

    async function createNewTask() {
        const url = document.getElementById('webhookUrl').value;
        const message = document.getElementById('message').value;
        const count = parseInt(document.getElementById('count').value);
        const delay = parseFloat(document.getElementById('delay').value) * 1000;
        const botName = document.getElementById('botName').value;
        const botAvatar = document.getElementById('botAvatar').value;
        const mentionType = document.getElementById('mentionType').value;
        const targetId = document.getElementById('targetId').value;

        const taskId = `task-${Date.now()}`;
        const logEntry = document.createElement('div');
        logEntry.id = taskId;
        logEntry.className = 'log-entry';
        logEntry.dataset.finished = "false";
        logEntry.dataset.running = "true";
        
        logEntry.innerHTML = `
            <div><span class="info-text">جاري البدء...</span></div>
            <div class="actions">
                <button class="btn-mini stop-btn" onclick="stopTask('${taskId}')">إيقاف</button>
                <button class="btn-mini del-btn hidden" onclick="this.parentElement.parentElement.remove()">حذف</button>
            </div>
        `;
        document.getElementById('taskLogs').prepend(logEntry);

        let mention = "";
        if (mentionType === "everyone") mention = "@everyone ";
        if (mentionType === "here") mention = "@here ";
        if (mentionType === "role") mention = `<@&${targetId}> `;

        for (let i = 1; i <= count; i++) {
            if (logEntry.dataset.running === "false") break;
            logEntry.querySelector('.info-text').innerText = `إرسال ${i} من ${count}...`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: mention + message, username: botName || undefined, avatar_url: botAvatar || undefined })
                });
                if (res.status === 429) {
                    const data = await res.json();
                    await new Promise(r => setTimeout(r, (data.retry_after * 1000) || 2000));
                    i--; continue;
                }
            } catch (e) { break; }
            if (i < count && logEntry.dataset.running === "true") await new Promise(r => setTimeout(r, delay));
        }

        logEntry.dataset.finished = "true";
        logEntry.querySelector('.info-text').innerText = `✅ اكتملت (${count})`;
        logEntry.querySelector('.stop-btn').classList.add('hidden');
        logEntry.querySelector('.del-btn').classList.remove('hidden');
    }

    function stopTask(id) {
        const el = document.getElementById(id);
        el.dataset.running = "false";
        el.dataset.finished = "true";
        el.querySelector('.info-text').innerText = "🛑 متوقف";
        el.querySelector('.stop-btn').classList.add('hidden');
        el.querySelector('.del-btn').classList.remove('hidden');
    }

    function clearFinished() {
        const finished = document.querySelectorAll('.log-entry[data-finished="true"]');
        finished.forEach(el => el.remove());
    }
</script>

</body>
</html>
