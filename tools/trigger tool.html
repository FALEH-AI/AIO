<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AL3MFALEH | FiveM Dev Tool 🚀</title>
    <style>
        :root { --bg: #0a0a0b; --card: #1a1b26; --text: #a9b1d6; --accent: #7aa2f7; --green: #9ece6a; --red: #f7768e; --orange: #ff9e64; --info: #bb9af7; --chain: #e0af68; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-layout { display: flex; gap: 20px; width: 100%; max-width: 1200px; align-items: flex-start; }
        .right-side { flex: 1.5; display: flex; flex-direction: column; gap: 20px; }
        .left-side { flex: 1; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 20px; }
        .container { background-color: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid #24283b; position: relative; }
        h2 { text-align: center; color: var(--accent); margin: 0 0 20px 0; border-bottom: 2px solid #24283b; padding-bottom: 10px; font-size: 1.2rem; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #565f89; font-size: 0.8rem; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #24283b; background-color: #24283b; color: #c0caf5; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; min-height: 60px; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .row div { flex: 1; }
        .switch-box { background: #16161e; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #24283b; }
        .flex-label { display: flex; justify-content: space-between; align-items: center; }
        button { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.8rem; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: #24283b; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-right: 3px solid var(--orange); }
        .file-name { font-size: 0.8rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
        .trigger-item { background-color: #24283b; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid var(--accent); }
        .info-panel { background: #16161e; padding: 10px; border-radius: 6px; display: none; margin-top: 10px; font-size: 0.75rem; border: 1px solid #414868; color: #9ece6a; white-space: pre-wrap; font-family: monospace; }
        .actions { display: flex; gap: 5px; }
        .btn-copy { background-color: var(--orange); color: #1a1b26; }
        .btn-send { background-color: var(--green); color: #1a1b26; }
        .btn-del { background-color: var(--red); color: #ffffff; }
        .btn-edit { background-color: var(--info); color: #000; }
        .disabled { display: none; }
    </style>
</head>
<body onload="initApp()">

<div class="main-layout">
    <div class="right-side">
        <div class="container">
            <h2>🛠️ مولد التريجرات الاحترافي | AL3MFALEH</h2>
            <div class="row">
                <div style="flex:2"><label>اسم التريجر الأول:</label><input type="text" id="eventName" placeholder="esx:giveInventoryItem"></div>
                <div><label>المعطيات (Params):</label><input type="text" id="params" placeholder="pID, 'bread', 1"></div>
            </div>
            <div><label>شرح التريجر:</label><textarea id="eventDesc" placeholder="اكتب هنا وظيفة التريجر..."></textarea></div>

            <div class="switch-box" style="border-right: 3px solid var(--chain);">
                <div class="flex-label"><label style="color:var(--chain)">🔗 تريجر تابع (Chain Trigger)</label><input type="checkbox" id="useChain" onchange="toggleFields()"></div>
                <div id="chainInputs" class="disabled">
                    <div class="row">
                        <div style="flex:2"><label>اسم التريجر الثاني:</label><input type="text" id="chainName" placeholder="chat:addMessage"></div>
                        <div><label>المعطيات:</label><input type="text" id="chainParams" placeholder="'تم'"></div>
                    </div>
                    <div><label>انتظار قبل التريجر الثاني (ms):</label><input type="number" id="chainWait" value="0" placeholder="0 = لا يوجد انتظار"></div>
                </div>
            </div>

            <div class="switch-box">
                <div class="flex-label"><label style="color:var(--green)">⌨️ تشغيل بضغط زر</label><input type="checkbox" id="useKey" onchange="toggleFields()"></div>
                <div id="keyInputs" class="row disabled"><select id="controlId"><option value="38">E (38)</option><option value="47">G (47)</option><option value="74">H (74)</option></select></div>
            </div>

            <div class="switch-box">
                <div class="flex-label"><label style="color:var(--orange)">🔄 تكرار عام (Global Loop)</label><input type="checkbox" id="useLoop" onchange="toggleFields()"></div>
                <div id="loopInputs" class="row disabled">
                    <div><label>المرات:</label><input type="number" id="loopCount" value="10"></div>
                    <div><label>الانتظار بين المرات (ms):</label><input type="number" id="delay" value="100"></div>
                </div>
            </div>

            <div class="switch-box">
                <div class="flex-label"><label style="color:var(--accent)">🎯 نطاق اللاعبين (Range pID)</label><input type="checkbox" id="useRange" onchange="toggleFields()"></div>
                <div id="rangeInputs" class="disabled">
                    <div class="row"><input type="number" id="idFrom" value="1" placeholder="ID من"><input type="number" id="idTo" value="10" placeholder="ID إلى"></div>
                    <div class="flex-label" style="margin-top:10px"><label style="color: #bb9af7;">⛓️ عدّاد متسلسل (vID) لكل لاعب؟</label><input type="checkbox" id="useSequential" onchange="toggleFields()"></div>
                    <div id="sequentialSettings" class="disabled">
                        <label style="font-size: 11px;">نطاق vID (من - إلى):</label>
                        <div class="row"><input type="number" id="seqFrom" value="1"><input type="number" id="seqTo" value="50"></div>
                    </div>
                    <div class="flex-label" style="margin-top:10px"><label style="font-size: 11px; color: #9ece6a;">⏳ انتظار داخل النطاق (Wait):</label><input type="checkbox" id="useRangeWait" checked></div>
                    <input type="number" id="rangeWaitMs" value="50">
                </div>
            </div>

            <button id="saveBtn" style="background-color: var(--accent); color: #1a1b26; width: 100%; font-weight: bold;" onclick="addNewTrigger()">حفظ التريجر ✅</button>
        </div>
        <div id="triggerList"></div>
    </div>

    <div class="left-side">
        <div class="container">
            <h2>⚙️ الإعدادات والملفات</h2>
            <label>رابط الـ Webhook:</label>
            <div style="display:flex; gap:5px; margin-bottom:15px"><input type="text" id="webhookUrl" disabled><button onclick="toggleWebhookEdit()" id="editWebhookBtn" style="background:var(--info)">✏️</button></div>
            <div style="border: 2px dashed #414868; padding: 15px; text-align: center; border-radius: 8px; background: #16161e;">
                <input type="file" id="fileInput" style="display:none" onchange="handleFileUpload(this)" multiple>
                <label for="fileInput" style="cursor:pointer; color:var(--accent); font-weight:bold;">رفع ملفات ➕</label>
            </div>
            <div id="fileList" style="margin-top:15px"></div>
        </div>
    </div>
</div>

<script>
    let triggers = JSON.parse(localStorage.getItem('v22Triggers')) || [];
    let savedFiles = JSON.parse(localStorage.getItem('savedFiles')) || [];
    let editId = null;
    let isEditingWebhook = false;

    function initApp() { 
        renderTriggers(); 
        renderFiles();
        toggleFields(); 
        document.getElementById('webhookUrl').value = localStorage.getItem('masterWebhook') || "https://discord.com/api/webhooks/...";
    }

    function toggleFields() {
        document.getElementById('keyInputs').style.display = document.getElementById('useKey').checked ? 'flex' : 'none';
        document.getElementById('loopInputs').style.display = document.getElementById('useLoop').checked ? 'flex' : 'none';
        document.getElementById('rangeInputs').className = document.getElementById('useRange').checked ? '' : 'disabled';
        document.getElementById('sequentialSettings').className = document.getElementById('useSequential').checked ? '' : 'disabled';
        document.getElementById('chainInputs').className = document.getElementById('useChain').checked ? '' : 'disabled';
    }

    function generateLua(t) {
        const safeName = t.name.replace(/"/g, "'");
        let p = t.params ? t.params.trim() : "";
        p = p.replace(/\bpID\b/gi, "pID").replace(/\bvID\b/gi, "vID");
        
        // بناء منطق التريجر الأول
        let coreLogic = `TriggerServerEvent('${safeName}'${p ? ', '+p : ''})`;
        
        // إضافة التريجر الثاني مع الانتظار إذا تم تفعيله
        if (t.useChain && t.chainName) {
            const safeChain = t.chainName.replace(/"/g, "'");
            let cp = t.chainParams ? t.chainParams.trim() : "";
            cp = cp.replace(/\bpID\b/gi, "pID").replace(/\bvID\b/gi, "vID");
            
            if (t.chainWait > 0) coreLogic += `\n        Citizen.Wait(${t.chainWait})`;
            coreLogic += `\n        TriggerServerEvent('${safeChain}'${cp ? ', '+cp : ''})`;
        }

        const needsThread = t.useKey || t.useLoop || t.useRange;
        let indent = needsThread ? (t.useKey ? "            " : "        ") : "";
        
        if (t.useRangeWait && t.useRange) coreLogic += `\n${indent}        Citizen.Wait(${t.rangeWaitMs})`;

        let logic = "";
        if (t.useRange) {
            if (t.useSequential) {
                logic = `${indent}for pID = ${t.idFrom}, ${t.idTo} do\n${indent}    for vID = ${t.seqFrom}, ${t.seqTo} do\n${indent}        ${coreLogic.replace(/\n/g, '\n' + indent + '        ')}\n${indent}    end\n${indent}end`;
            } else {
                logic = `${indent}for pID = ${t.idFrom}, ${t.idTo} do\n${indent}    ${coreLogic.replace(/\n/g, '\n' + indent + '    ')}\n${indent}end`;
            }
        } else {
            logic = indent + coreLogic.replace(/\n/g, '\n' + indent);
        }

        if (t.useLoop) {
            let loopIndent = t.useKey ? "        " : "    ";
            logic = `${loopIndent}for i = 1, ${t.loopCount} do\n${logic}\n${t.delay > 0 ? loopIndent + '    Citizen.Wait(' + t.delay + ')\n' : ''}${loopIndent}end`;
        }

        if (t.useKey) {
            return `Citizen.CreateThread(function()\n    while true do\n        Citizen.Wait(0)\n        if IsControlJustReleased(0, ${t.controlId}) then\n${logic}\n        end\n    end\nend)`;
        } else if (t.useLoop || t.useRange) {
            return `Citizen.CreateThread(function()\n${logic}\nend)`;
        } else {
            return coreLogic;
        }
    }

    function addNewTrigger() {
        const data = {
            id: editId || Date.now(),
            name: document.getElementById('eventName').value || "Event",
            params: document.getElementById('params').value,
            desc: document.getElementById('eventDesc').value || "",
            useChain: document.getElementById('useChain').checked,
            chainName: document.getElementById('chainName').value,
            chainParams: document.getElementById('chainParams').value,
            chainWait: parseInt(document.getElementById('chainWait').value) || 0,
            useKey: document.getElementById('useKey').checked,
            controlId: document.getElementById('controlId').value,
            useLoop: document.getElementById('useLoop').checked,
            loopCount: document.getElementById('loopCount').value,
            delay: document.getElementById('delay').value,
            useRange: document.getElementById('useRange').checked,
            idFrom: document.getElementById('idFrom').value,
            idTo: document.getElementById('idTo').value,
            useSequential: document.getElementById('useSequential').checked,
            seqFrom: document.getElementById('seqFrom').value,
            seqTo: document.getElementById('seqTo').value,
            useRangeWait: document.getElementById('useRangeWait').checked,
            rangeWaitMs: document.getElementById('rangeWaitMs').value
        };

        if (editId) {
            const index = triggers.findIndex(t => t.id === editId);
            triggers[index] = data;
            editId = null;
            document.getElementById('saveBtn').innerText = "حفظ التريجر ✅";
        } else {
            triggers.push(data);
        }
        localStorage.setItem('v22Triggers', JSON.stringify(triggers));
        renderTriggers();
        clearInputs();
    }

    function clearInputs() {
        ['eventName','params','eventDesc','chainName','chainParams','chainWait'].forEach(id => document.getElementById(id).value = id === 'chainWait' ? "0" : "");
        ['useKey','useLoop','useRange','useSequential','useChain'].forEach(id => document.getElementById(id).checked = false);
        toggleFields();
    }

    function loadToEdit(id) {
        const t = triggers.find(x => x.id === id);
        editId = t.id;
        document.getElementById('eventName').value = t.name;
        document.getElementById('params').value = t.params;
        document.getElementById('eventDesc').value = t.desc || "";
        document.getElementById('useChain').checked = t.useChain || false;
        document.getElementById('chainName').value = t.chainName || "";
        document.getElementById('chainParams').value = t.chainParams || "";
        document.getElementById('chainWait').value = t.chainWait || 0;
        document.getElementById('useKey').checked = t.useKey;
        document.getElementById('controlId').value = t.controlId;
        document.getElementById('useLoop').checked = t.useLoop;
        document.getElementById('loopCount').value = t.loopCount;
        document.getElementById('delay').value = t.delay;
        document.getElementById('useRange').checked = t.useRange;
        document.getElementById('idFrom').value = t.idFrom;
        document.getElementById('idTo').value = t.idTo;
        document.getElementById('useSequential').checked = t.useSequential;
        document.getElementById('seqFrom').value = t.seqFrom;
        document.getElementById('seqTo').value = t.seqTo;
        document.getElementById('saveBtn').innerText = "تحديث التريجر 💾";
        toggleFields();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function renderTriggers() {
        document.getElementById('triggerList').innerHTML = triggers.map(t => `
            <div class="trigger-item" style="${t.useChain ? 'border-right-color: var(--chain)' : ''}">
                <div class="item-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <b>🚀 ${t.name} ${t.useChain ? '<span style="color:var(--chain); font-size:10px;">[🔗 +1]</span>' : ''}</b>
                    <div class="actions">
                        <button class="btn-edit" onclick="loadToEdit(${t.id})">✏️</button>
                        <button style="background:var(--accent)" onclick="toggleInfo(${t.id})">📜</button>
                        <button class="btn-copy" onclick="copyTrigger(${t.id})">نسخ</button>
                        <button class="btn-send" onclick="sendToDiscord(${t.id})">📡</button>
                        <button class="btn-del" onclick="deleteTrigger(${t.id})">🗑️</button>
                    </div>
                </div>
                ${t.desc ? `<div style="font-size: 0.7rem; color: #565f89; margin-top: 5px;">📝 ${t.desc}</div>` : ''}
                <div id="info-${t.id}" class="info-panel">${generateLua(t)}</div>
            </div>
        `).join('');
    }

    function toggleWebhookEdit() {
        const input = document.getElementById('webhookUrl');
        const btn = document.getElementById('editWebhookBtn');
        if (!isEditingWebhook) { input.disabled = false; input.focus(); btn.innerText = "✅"; isEditingWebhook = true; }
        else { localStorage.setItem('masterWebhook', input.value); input.disabled = true; btn.innerText = "✏️"; isEditingWebhook = false; }
    }
    function toggleInfo(id) { const el = document.getElementById(`info-${id}`); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
    function copyTrigger(id) { navigator.clipboard.writeText(generateLua(triggers.find(t => t.id === id))).then(() => alert("تم النسخ!")); }
    function deleteTrigger(id) { triggers = triggers.filter(t => t.id !== id); localStorage.setItem('v22Triggers', JSON.stringify(triggers)); renderTriggers(); }
    function handleFileUpload(input) {
        for (let f of input.files) {
            const r = new FileReader();
            r.onload = (e) => {
                savedFiles.push({id: Date.now() + Math.random(), name: f.name, content: e.target.result});
                localStorage.setItem('savedFiles', JSON.stringify(savedFiles));
                renderFiles();
            };
            r.readAsText(f);
        }
    }
    function renderFiles() {
        document.getElementById('fileList').innerHTML = savedFiles.map(f => `
            <div class="file-item"><span class="file-name">📄 ${f.name}</span><div class="actions"><button class="btn-copy" onclick="copyFileContent(${f.id})">نسخ</button><button class="btn-del" onclick="deleteFile(${f.id})">🗑️</button></div></div>
        `).join('');
    }
    function copyFileContent(id) { const f = savedFiles.find(x => x.id === id); navigator.clipboard.writeText(f.content).then(() => alert("تم نسخ محتوى الملف!")); }
    function deleteFile(id) { if(confirm("حذف الملف؟")) { savedFiles = savedFiles.filter(f => f.id !== id); localStorage.setItem('savedFiles', JSON.stringify(savedFiles)); renderFiles(); } }
    async function sendToDiscord(id) {
        const url = localStorage.getItem('masterWebhook');
        const t = triggers.find(tr => tr.id === id);
        if(!url || url.includes('...')) return alert("يرجى ضبط رابط الويب هوك أولاً!");
        const embed = {
            title: "📡 Export Trigger | AL3MFALEH", color: 7506394,
            fields: [{ name: "Event", value: `\`${t.name}\``, inline: true }, { name: "Description", value: t.desc || "---" }],
            description: "```lua\n" + generateLua(t) + "\n```",
            footer: { text: "Dev Tool by AL3MFALEH" }, timestamp: new Date()
        };
        await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ embeds: [embed] }) });
        alert("تم الإرسال!");
    }
</script>
</body>
</html>
