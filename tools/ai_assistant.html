<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #0a0a0b; color: #a9b1d6; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .chat-container { max-width: 900px; margin: auto; height: 90vh; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #24283b; padding: 20px; border-radius: 12px; background: #111116; margin-bottom: 20px; }
        .input-area { display: flex; gap: 10px; background: #1a1b26; padding: 10px; border-radius: 12px; border: 1px solid #24283b; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 16px; }
        button { background: #7aa2f7; color: #1a1b26; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .msg { margin-bottom: 15px; padding: 12px; border-radius: 10px; line-height: 1.6; max-width: 85%; }
        .user-msg { background: #24283b; align-self: flex-start; margin-right: auto; color: #fff; }
        .ai-msg { background: #1e2233; border-right: 4px solid #00ff95; align-self: flex-end; margin-left: auto; }
        pre { background: #000; padding: 10px; border-radius: 5px; overflow-x: auto; color: #7aa2f7; } /* لتنسيق الأكواد */
    </style>
</head>
<body>
    <div class="chat-container">
        <h2 style="color: #00ff95; text-align: center;">🤖 AL3MFALEH AI (FiveM Expert)</h2>
        <div id="chat-box" style="display: flex; flex-direction: column;">
            <div class="msg ai-msg">هلا يا وحش! أنا مساعدك الذكي في تريجرات فايف ام. وش تبي نسوي اليوم؟ (تعديل، شرح، أو صنع تريجر جديد؟)</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="اكتب سؤالك هنا عن التريجرات...">
            <button onclick="askAI()">إرسال</button>
        </div>
    </div>

    <script type="module">
        // استيراد المكتبة المجانية من قوقل
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // ضع مفتاحك المجاني هنا
        const API_KEY = "AIzaSyAXrqgRC-2skBl3JO8JAR2kRH1GVZk4Xuw"; 
        const genAI = new GoogleGenerativeAI(API_KEY);

        window.askAI = async function() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if (!input.value) return;

            const userText = input.value;
            chatBox.innerHTML += `<div class="msg user-msg">${userText}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const model = genAI.getGenerativeModel({ 
                    model: "gemini-1.5-flash",
                    systemInstruction: "أنت خبير في FiveM Lua وتريجرات QBCore و ESX. مهمتك مساعدة المستخدم في كتابة وشرح وتحليل التريجرات البرمجية. ردك يجب أن يكون تقني ومختصر ومفيد."
                });

                const result = await model.generateContent(userText);
                const response = await result.response;
                const text = response.text();

                chatBox.innerHTML += `<div class="msg ai-msg">${text.replace(/\n/g, '<br>')}</div>`;
            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai-msg" style="color: red;">خطأ: تأكد من مفتاح الـ API أو اتصالك بالإنترنت.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
